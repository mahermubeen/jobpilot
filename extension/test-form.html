<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JobPilot filler test form</title>
<style>body{font:15px system-ui;max-width:640px;margin:24px auto;display:grid;gap:14px}label,fieldset{display:grid;gap:4px}</style>
</head>
<body>
<!-- A form with every field type the filler handles. Open it in Chrome and
     press the JobPilot icon to try the extension without touching a real site. -->
<h1>Test application form</h1>
<form onsubmit="event.preventDefault(); document.title='SUBMITTED'">
  <label>First name <input name="first" required></label>
  <label>Last name <input name="last"></label>
  <label for="em">Email address</label><input id="em" type="email">
  <label>Phone <input type="tel" name="phone"></label>
  <label>LinkedIn profile <input type="url" name="linkedin"></label>
  <label>Already filled <input name="kept" value="keep me"></label>
  <label>How many years of experience do you have with React? <input type="number" name="react"></label>
  <label>What is your expected salary? <input name="salary"></label>
  <label>Country
    <select name="country"><option value="">Select…</option><option value="pk">Pakistan</option><option value="us">United States</option></select>
  </label>
  <fieldset>
    <legend>Are you legally authorised to work in Pakistan?</legend>
    <label><input type="radio" name="auth" value="1"> Yes</label>
    <label><input type="radio" name="auth" value="0"> No</label>
  </fieldset>
  <fieldset>
    <legend>Which of these have you used in production?</legend>
    <label><input type="checkbox" name="stack" value="a"> React Native</label>
    <label><input type="checkbox" name="stack" value="b"> Rust</label>
    <label><input type="checkbox" name="stack" value="c"> Node.js</label>
  </fieldset>
  <label><input type="checkbox" name="terms"> I agree to the privacy policy</label>
  <label>Why do you want this job? <textarea name="why" maxlength="600"></textarea></label>
  <label>City <input name="city" role="combobox" aria-autocomplete="list"></label>
  <label>Resume/CV <input type="file" name="resume" accept=".pdf,.doc,.docx"></label>
  <input type="hidden" name="token" value="x">
  <label>Password <input type="password" name="pw"></label>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
