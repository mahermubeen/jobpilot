# ai-repo-kit: static security analysis (free for public repos).
# install.sh fills in the language list from what it detects. Edit if needed:
# javascript-typescript, python, go, java-kotlin, csharp, ruby, c-cpp, actions
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ (matrix.language == 'go' || matrix.language == 'c-cpp') && 'autobuild' || 'none' }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
